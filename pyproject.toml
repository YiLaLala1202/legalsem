[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "legalsem"
version = "1.0.0"
description = "Knowledge-guided dynamic legal text classification through semantic element modeling"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Yi Shao" }]
keywords = ["legal-nlp", "text-classification", "prompt-engineering", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.30",
    "PyYAML>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
analysis = ["numpy>=1.24", "matplotlib>=3.7", "scikit-learn>=1.3"]
vllm = ["vllm>=0.6", "transformers>=4.44"]
models = ["huggingface_hub>=0.23"]

[project.urls]
Homepage = "https://github.com/YiLaLala1202/legalsem"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = { "" = "src" }
