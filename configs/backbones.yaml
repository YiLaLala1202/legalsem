# Model backends used in the experiments.
#
# Credentials are never stored here. Each entry names the environment variable
# that must hold the key:
#
#   export SILICONFLOW_API_KEY="..."      # hosted vendor API
#   export LOCAL_VLLM_API_KEY="dummy"     # any non-empty string for local servers
#
# Serving a local checkpoint with an OpenAI-compatible endpoint:
#
#   vllm serve Qwen/Qwen3-8B --port 8000 --dtype float16
#
# In that case set backend: api, base_url: http://127.0.0.1:8000/v1 and
# api_key_env: LOCAL_VLLM_API_KEY. Use backend: vllm only when you want
# in-process offline generation (single process, holds the GPU for the run).

backbones:
  qwen2.5-7b:
    backend: api
    model: Qwen/Qwen2.5-7B-Instruct
    base_url: http://127.0.0.1:8000/v1
    api_key_env: LOCAL_VLLM_API_KEY
    sampling: {temperature: 0.0, top_p: 0.1, max_tokens: 1024}

  qwen3-8b:
    backend: api
    model: Qwen/Qwen3-8B
    base_url: http://127.0.0.1:8000/v1
    api_key_env: LOCAL_VLLM_API_KEY
    sampling: {temperature: 0.0, top_p: 0.1, max_tokens: 1024}

  deepseek-r1-qwen3-8b:
    backend: api
    model: deepseek-ai/DeepSeek-R1-0528-Qwen3-8B
    base_url: https://api.siliconflow.cn/v1
    api_key_env: SILICONFLOW_API_KEY
    sampling: {temperature: 0.0, top_p: 0.1, max_tokens: 1024}

  claude-sonnet:
    backend: api
    model: claude-sonnet-4
    base_url: https://your-endpoint.example/v1
    api_key_env: CLAUDE_API_KEY
    sampling: {temperature: 0.0, top_p: 0.1, max_tokens: 2048}

  gpt-5.4:
    backend: api
    model: gpt-5.4
    base_url: https://your-endpoint.example/v1
    api_key_env: OPENAI_API_KEY
    sampling: {temperature: 0.0, top_p: 0.1, max_tokens: 2048}

  legalone-8b:
    # End-to-end baseline: no element extraction, direct conflict classification.
    backend: api
    model: LegalOne-8B
    base_url: http://127.0.0.1:8000/v1
    api_key_env: LOCAL_VLLM_API_KEY
    sampling: {temperature: 0.0, top_p: 0.1, max_tokens: 256}
